name: Release

# Versões estáveis: tag vX.Y.Z criada na main gera instaladores e uma GitHub Release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag precisa estar na main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag precisa bater com package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

  build:
    needs: validate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage tar.gz
          - os: windows-latest
            args: --win nsis zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Assinatura VMP (DRM no Windows). Opcional: só roda se os secrets existirem.
      - name: castLabs EVS (VMP)
        if: runner.os == 'Windows' && env.EVS_ACCOUNT_NAME != ''
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          pip install --upgrade castlabs-evs
          python -m castlabs_evs.account reauth -A "$env:EVS_ACCOUNT_NAME" -P "$env:EVS_PASSWD"
      - run: npx electron-builder ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
            dist/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## \[${GITHUB_REF_NAME#v}\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" out/* --title "Apollo $GITHUB_REF_NAME" --notes "${notes:-Veja o CHANGELOG.md}"
