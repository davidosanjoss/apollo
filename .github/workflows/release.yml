name: Release

# Tag vX.Y.Z na main → builds Linux/Windows publicados nas Releases deste repositório.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag precisa estar na main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag precisa bater com package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

  # Nada é compilado nem publicado se algum teste falhar.
  test:
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Checagem de tipos
        run: npm run typecheck
      - name: Testes unitários
        run: npm test
      - name: Testes de integração (app real, tela virtual)
        if: runner.os == 'Linux'
        run: scripts/ci-e2e.sh
      - name: Compatibilidade com o Bitwarden (Vaultwarden + CLI oficial)
        if: runner.os == 'Linux'
        run: npm run test:interop

  build:
    needs: test
    permissions:
      contents: write # cria a release (rascunho) neste repositório
    # O "if" de um passo não enxerga o env do próprio passo: o teste fica no job.
    env:
      HAS_EVS: ${{ secrets.EVS_ACCOUNT_NAME != '' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage tar.gz
          - os: windows-latest
            args: --win nsis zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Assinatura VMP (DRM no Windows). Opcional: só roda se os secrets existirem.
      - name: castLabs EVS (VMP)
        if: runner.os == 'Windows' && env.HAS_EVS == 'true'
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          pip install --upgrade castlabs-evs
          python -m castlabs_evs.account reauth -A "$env:EVS_ACCOUNT_NAME" -P "$env:EVS_PASSWD"
      # Publica como RASCUNHO; só vira pública no job seguinte, com tudo pronto.
      - name: Build e upload (rascunho)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build.mjs --prod
          npx electron-builder ${{ matrix.args }} --publish always

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publicar release com notas do CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk "/^## \[${version//./\\.}\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Veja o histórico de mudanças." > notes.md
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --title "Apollo $GITHUB_REF_NAME" --notes-file notes.md --draft=false --latest

  # Pacote do AUR (apollo-browser-bin). Só roda com o secret AUR_SSH_PRIVATE_KEY (ver
  # docs/RELEASING.md); sem ele, os passos são pulados.
  aur:
    needs: publish
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      HAS_AUR: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Ferramentas
        if: env.HAS_AUR == 'true'
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib
      - uses: actions/checkout@v4
        if: env.HAS_AUR == 'true'
      - name: Publicar no AUR
        if: env.HAS_AUR == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          useradd -m builder
          install -d -m 700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org > /home/builder/.ssh/known_hosts 2>/dev/null
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n' > /home/builder/.ssh/config
          chown -R builder:builder /home/builder/.ssh && chmod 600 /home/builder/.ssh/*
          cp -r packaging/aur /home/builder/packaging && chown -R builder:builder /home/builder/packaging
          runuser -u builder -- git clone ssh://aur@aur.archlinux.org/apollo-browser-bin.git /home/builder/aur
          runuser -u builder -- bash -c "cd /home/builder && packaging/publish.sh '$version' /home/builder/aur"
