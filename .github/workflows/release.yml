name: Release

# Tag vX.Y.Z na main → builds Linux/Windows publicados em davidosanjoss/apollo-releases (público).
# Requer o secret RELEASES_TOKEN: token fine-grained com "Contents: read and write" só no apollo-releases.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  RELEASES_REPO: davidosanjoss/apollo-releases

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag precisa estar na main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag precisa bater com package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

  build:
    needs: validate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage tar.gz
          - os: windows-latest
            args: --win nsis zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Assinatura VMP (DRM no Windows). Opcional: só roda se os secrets existirem.
      - name: castLabs EVS (VMP)
        if: runner.os == 'Windows' && env.EVS_ACCOUNT_NAME != ''
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          pip install --upgrade castlabs-evs
          python -m castlabs_evs.account reauth -A "$env:EVS_ACCOUNT_NAME" -P "$env:EVS_PASSWD"
      # Publica como RASCUNHO; só vira pública no job seguinte, com tudo pronto.
      - name: Build e upload para apollo-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          npm run typecheck
          npm test
          node scripts/build.mjs --prod
          npx electron-builder ${{ matrix.args }} --publish always

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar release com notas do CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk "/^## \[${version//./\\.}\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Veja o histórico de mudanças." > notes.md
          gh release edit "$GITHUB_REF_NAME" -R "$RELEASES_REPO" \
            --title "Apollo $GITHUB_REF_NAME" --notes-file notes.md --draft=false --latest
