name: Release

# Tag vX.Y.Z na main → builds Linux/Windows publicados nas Releases deste repositório.
# Transição: também copia a versão para davidosanjoss/apollo-releases (onde as instalações
# até a 0.7.0 procuram atualização), se o secret RELEASES_TOKEN existir.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  MIRROR_REPO: davidosanjoss/apollo-releases

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag precisa estar na main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag precisa bater com package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

  # Nada é compilado nem publicado se algum teste falhar.
  test:
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Checagem de tipos
        run: npm run typecheck
      - name: Testes unitários
        run: npm test
      - name: Testes de integração (app real, tela virtual)
        if: runner.os == 'Linux'
        run: scripts/ci-e2e.sh
      - name: Compatibilidade com o Bitwarden (Vaultwarden + CLI oficial)
        if: runner.os == 'Linux'
        run: npm run test:interop

  build:
    needs: test
    permissions:
      contents: write # cria a release (rascunho) neste repositório
    # O "if" de um passo não enxerga o env do próprio passo: o teste fica no job.
    env:
      HAS_EVS: ${{ secrets.EVS_ACCOUNT_NAME != '' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage tar.gz
          - os: windows-latest
            args: --win nsis zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Assinatura VMP (DRM no Windows). Opcional: só roda se os secrets existirem.
      - name: castLabs EVS (VMP)
        if: runner.os == 'Windows' && env.HAS_EVS == 'true'
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          pip install --upgrade castlabs-evs
          python -m castlabs_evs.account reauth -A "$env:EVS_ACCOUNT_NAME" -P "$env:EVS_PASSWD"
      # Publica como RASCUNHO; só vira pública no job seguinte, com tudo pronto.
      - name: Build e upload (rascunho)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build.mjs --prod
          npx electron-builder ${{ matrix.args }} --publish always

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_MIRROR: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Publicar release com notas do CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk "/^## \[${version//./\\.}\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Veja o histórico de mudanças." > notes.md
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --title "Apollo $GITHUB_REF_NAME" --notes-file notes.md --draft=false --latest
      # Transição: instalações até a 0.7.0 procuram atualização no apollo-releases.
      # Remover quando ninguém mais usar essas versões.
      - name: Copiar para o apollo-releases (transição)
        if: env.HAS_MIRROR == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          # Pasta temporária do runner (o repositório já tem uma pasta "assets").
          dir="$RUNNER_TEMP/mirror"
          mkdir -p "$dir"
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D "$dir"
          gh release create "$GITHUB_REF_NAME" -R "$MIRROR_REPO" --title "Apollo $GITHUB_REF_NAME" \
            --notes-file notes.md --latest "$dir"/*
