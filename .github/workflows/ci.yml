name: CI

# Repositório público (minutos gratuitos): Linux e Windows em todo push na dev e em PRs
# para a dev (contribuições) e para a main (versões). Os nomes "build (ubuntu-latest)" e
# "build (windows-latest)" são checagens obrigatórias na proteção da main.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Checagem de tipos
        run: npm run typecheck
      - name: Testes unitários
        run: npm test
      - name: Testes de integração (app real, tela virtual)
        if: runner.os == 'Linux'
        run: scripts/ci-e2e.sh
      - name: Compatibilidade com o Bitwarden (Vaultwarden + CLI oficial)
        if: runner.os == 'Linux'
        run: npm run test:interop
      - name: Build (sem instalador)
        run: |
          node scripts/build.mjs --prod
          npx electron-builder --dir --publish never
