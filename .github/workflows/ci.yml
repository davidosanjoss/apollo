name: CI

# Repo privado tem cota de minutos (Windows conta em dobro):
# push na dev → só Linux; PR para main → Linux + Windows.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Checagem de tipos
        run: npm run typecheck
      - name: Testes unitários
        run: npm test
      - name: Testes de integração (app real, tela virtual)
        if: runner.os == 'Linux'
        run: scripts/ci-e2e.sh
      - name: Build (sem instalador)
        run: |
          node scripts/build.mjs --prod
          npx electron-builder --dir --publish never
