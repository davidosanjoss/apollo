name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Checagem de sintaxe
        shell: bash
        run: for f in $(git ls-files 'src/*.js' 'scripts/*.cjs' 'scripts/*.mjs'); do node --check "$f"; done
      - name: Build (sem instalador)
        run: npx electron-builder --dir
      - uses: actions/upload-artifact@v4
        with:
          name: apollo-dev-${{ matrix.os }}
          path: dist/*-unpacked
          retention-days: 7
