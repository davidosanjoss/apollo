<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:">
  <title>Apollo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="sidebar">
    <div id="workspace-list"></div>
    <button id="add-workspace" class="ws-btn add" title="Novo workspace">+</button>
  </aside>

  <main id="main">
    <header id="toolbar">
      <div id="tabs"></div>
      <button id="new-tab" class="icon-btn" title="Nova aba (Ctrl+T)">+</button>
    </header>
    <nav id="navbar">
      <button id="back" class="icon-btn" title="Voltar (Alt+←)">←</button>
      <button id="forward" class="icon-btn" title="Avançar (Alt+→)">→</button>
      <button id="reload" class="icon-btn" title="Recarregar (Ctrl+R)">⟳</button>
      <span id="ws-badge"></span>
      <input id="address" type="text" spellcheck="false" placeholder="Pesquise ou digite um endereço">
    </nav>
    <div id="update-bar" hidden>
      <span id="update-text"></span>
      <span class="spacer"></span>
      <button id="update-primary" class="primary"></button>
      <button id="update-later">Depois</button>
    </div>
    <div id="views"></div>
  </main>

  <dialog id="ws-dialog">
    <form method="dialog" id="ws-form">
      <h2 id="ws-dialog-title">Novo workspace</h2>
      <label>Nome <input id="ws-name" required maxlength="30" autocomplete="off"></label>
      <label>Cor <input id="ws-color" type="color" value="#7c5cff"></label>
      <label>Página inicial <input id="ws-home" placeholder="Vazio = página inicial do Apollo" autocomplete="off"></label>
      <div class="dialog-actions">
        <button type="button" id="ws-delete" class="danger">Excluir workspace</button>
        <span class="spacer"></span>
        <button type="button" id="ws-cancel">Cancelar</button>
        <button type="submit" id="ws-save" class="primary">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
